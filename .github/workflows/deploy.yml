# Build the site and publish it to GitHub Pages at https://lcrlabs.de.
#
# Nothing generated is committed: `main` holds source only, and this workflow
# is the single thing that produces what Pages serves. It has no secrets and
# needs none — the build must never require one.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repository, mint the Pages deployment token. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish; a
# newer push simply queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile and package.json disagree.
      - name: Install dependencies
        run: npm ci

      # Astro + TypeScript diagnostics. A non-zero exit stops the job here, so
      # a type error never reaches production.
      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
